services:
    db:
        image: postgres:18-alpine
        ports:
        - "5432:5432"
        environment:
        - POSTGRES_USER=docker
        - POSTGRES_PASSWORD=docker
        - POSTGRES_DB=project_timegate
        volumes:
        - digital_voyage_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U docker -d project_timegate"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
    pgadmin:
        image: dpage/pgadmin4:latest
        ports:
        - "5050:80"
        environment:
        - PGADMIN_DEFAULT_EMAIL=admin@admin.com
        - PGADMIN_DEFAULT_PASSWORD=admin
        volumes:
        - digital_voyage_pgadmin_data:/var/lib/pgadmin
        depends_on:
        - db
    redis:
        image: redis:alpine
        ports:
        - "6379:6379"
        environment:
        - ALLOW_EMPTY_PASSWORD=true
        volumes:
            - digital_voyage_redis_data:/data
volumes:
    digital_voyage_db_data:
    digital_voyage_pgadmin_data:
    digital_voyage_redis_data:
